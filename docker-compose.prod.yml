version: "3.9"

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-caravanshare}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_STORE: ${SESSION_STORE:-mysql}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}"
      NAVER_CLIENT_ID: "${NAVER_CLIENT_ID}"
      NAVER_CLIENT_SECRET: "${NAVER_CLIENT_SECRET}"
      NAVER_CALLBACK_URL: "${NAVER_CALLBACK_URL:-http://localhost/api/auth/naver/callback}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET}"
      KAKAO_CALLBACK_URL: "${KAKAO_CALLBACK_URL:-http://localhost/api/auth/kakao/callback}"
    depends_on:
      - db

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx.caravanshare.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:

