# docker-compose.prod.yml
version: "3.9"

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/caravan_booking.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
    volumes:
      - data:/app/data
    expose:
      - "8000"

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx.caravanshare.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # <-- Mount SSL certificates
      - /var/www/certbot:/var/www/certbot:ro # <-- Mount certbot renewal dir
    ports:
      - "80:80"   # <-- Expose port 80 for HTTP and renewals
      - "443:443" # <-- Expose port 443 for HTTPS
    depends_on:
      - api

volumes:
  data: